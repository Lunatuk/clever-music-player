name: clever_music_player
description: Local-first smart music player for desktop, with Android-compatible architecture.
publish_to: none

version: 0.2.1

environment:
  sdk: ^3.6.0

dependencies:
  cmp_file_ops:
    path: third_party/cmp_file_ops
  audio_service: 0.18.19
  audio_session: 0.2.3
  crypto: ^3.0.6
  ffi: ^2.2.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  drift: ^2.25.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28
  just_audio: ^0.10.5
  audio_metadata_reader: ^1.6.0
  just_audio_windows: ^0.2.3
  smtc_windows: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.25.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  audio_metadata_reader:
    path: third_party/audio_metadata_reader
  just_audio_windows:
    path: third_party/just_audio_windows
  # smtc_windows 1.1.0 was generated with flutter_rust_bridge 2.11.1.
  # Newer 2.x runtime versions fail SMTC initialization at runtime.
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
