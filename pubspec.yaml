name: clever_music_player
description: Local-first smart music player for desktop, with Android-compatible architecture.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  crypto: ^3.0.6
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  drift: ^2.25.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28
  just_audio: ^0.10.5
  audio_metadata_reader: ^1.6.0

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.25.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
