name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.41.9'
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify native Windows audio protocol
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tool/check_windows_audio_contract.ps1 -FlutterRoot $env:FLUTTER_ROOT
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool/check_downloaded_audio.dart
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub --reporter expanded
      - name: Build Windows release
        if: runner.os == 'Windows'
        run: flutter build windows --release --no-pub
      - name: Build macOS release
        if: runner.os == 'macOS'
        run: flutter build macos --release --no-pub
