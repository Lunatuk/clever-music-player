name: Android prototype checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi --build-number=26
      - run: python3 tool/verify_android_apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Native lint
        working-directory: android
        run: ./gradlew -Ptarget-platform=android-arm64 :app:lintRelease
      - name: Native folder traversal tests
        working-directory: android
        run: ./gradlew -Ptarget-platform=android-arm64 :app:testReleaseUnitTest -x compileFlutterBuildRelease
